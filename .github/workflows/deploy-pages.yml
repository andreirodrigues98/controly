name: Deploy Controly to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar codigo
        run: |
          npm run check

      - name: Gerar somente arquivos publicos (ambiente de producao)
        run: npm run build:production
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          CONTROLY_APPCHECK_SITE_KEY: ${{ vars.CONTROLY_APPCHECK_SITE_KEY }}
          CONTROLY_ADMIN_BACKEND_ENABLED: ${{ vars.CONTROLY_ADMIN_BACKEND_ENABLED }}
          CONTROLY_ADMIN_WORKER_URL: ${{ vars.CONTROLY_ADMIN_WORKER_URL }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar apenas o diretorio publico
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
